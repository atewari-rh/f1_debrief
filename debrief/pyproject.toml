[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1debrief"
version = "0.1.0"
description = "Post-session approach cards built on f1frame's shared meter grid."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["f1frame>=0.1"]

[project.scripts]
f1-debrief = "f1debrief.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
f1debrief = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
